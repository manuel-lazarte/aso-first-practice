---
- name: Actualizar repositorios en openSUSE 15.6
  hosts: all
  become: yes
  tasks:
    - name: Actualizar repositorios de openSUSE
      zypper:
        name: '*'
        state: latest
      retries: 5              # Número de intentos
      delay: 10               # Tiempo de espera (en segundos) entre cada intento
      when: ansible_facts['distribution'] == 'openSUSE'
      register: zypper_update
      until: zypper_update is success  # Intentará hasta que la tarea sea exitosa
