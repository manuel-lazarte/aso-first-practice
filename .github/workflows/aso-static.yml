name: ASO static validation
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ansible and validators (no VM deployment)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ansible-core==2.21.5' 'ansible-lint' 'PyYAML' 'Jinja2'
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Validate YAML and Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from jinja2 import Environment
          for path in Path('.').rglob('*.yml'):
              if '.github' in path.parts:
                  # GitHub YAML has its own `on` syntax; PyYAML only checks parsing.
                  pass
              yaml.safe_load(path.read_text(encoding='utf-8'))
          for path in Path('.').rglob('*.j2'):
              Environment().parse(path.read_text(encoding='utf-8'))
          print('YAML and Jinja2 parsed')
          PY
      - name: Validate shell and CIDR tests
        run: |
          for file in scripts/*.sh tests/*.sh; do bash -n "$file"; done
          python -m unittest discover -s tests -v
          bash tests/test_tls_certs.sh
      - name: Validate roles and playbook syntax
        run: |
          ansible-inventory -i hosts --graph
          ansible-playbook -i hosts deploy.yml --syntax-check
      - name: Ansible lint
        run: ansible-lint --profile min -q deploy.yml
