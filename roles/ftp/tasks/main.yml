---
- name: Instalar vsftpd y herramientas de SELinux
  ansible.builtin.zypper:
    name:
      - vsftpd
      - policycoreutils-python-utils
    state: present

- name: Crear grupo del usuario FTP
  ansible.builtin.group:
    name: "{{ ftp_user_name }}"
    state: present

- name: Crear usuario FTP limitado por lista blanca
  ansible.builtin.user:
    name: "{{ ftp_user_name }}"
    group: "{{ ftp_user_name }}"
    home: "{{ ftp_root }}"
    create_home: false
    shell: /bin/bash
    password: "{{ vault_ftp_password_hash }}"
    state: present
  no_log: true

- name: Raiz FTP no escribible para chroot
  ansible.builtin.file:
    path: "{{ ftp_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Crear directorio para subidas
  ansible.builtin.file:
    path: "{{ ftp_root }}/subidas"
    state: directory
    owner: "{{ ftp_user_name }}"
    group: "{{ ftp_user_name }}"
    mode: '0750'

- name: Etiquetar raiz FTP para SELinux
  community.general.sefcontext:
    target: "{{ ftp_root }}/?"
    setype: public_content_t
    state: present
  register: ftp_root_context
  when: ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'

- name: Etiquetar area de escritura FTP
  community.general.sefcontext:
    target: "{{ ftp_root }}/subidas(/.*)?"
    setype: public_content_rw_t
    state: present
  register: ftp_upload_context
  when: ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'

- name: Permitir escritura FTP sobre public_content_rw_t bajo SELinux
  community.general.seboolean:
    name: ftpd_anon_write
    state: true
    persistent: true
  when: ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'

- name: Aplicar contextos FTP al crearse reglas
  ansible.builtin.command: "restorecon -RF {{ ftp_root }}"
  when: ftp_root_context is changed or ftp_upload_context is changed

- name: Publicar usuario permitido
  ansible.builtin.copy:
    dest: /etc/vsftpd.user_list
    content: "{{ ftp_user_name }}\n"
    owner: root
    group: root
    mode: '0600'
  notify: Reiniciar vsftpd

- name: Publicar template FTP
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: '0600'
    backup: true
  notify: Reiniciar vsftpd

- name: Habilitar e iniciar vsftpd
  ansible.builtin.systemd:
    name: vsftpd
    enabled: true
    state: started

- name: Abrir puerto FTP de control solo desde la red privada
  ansible.posix.firewalld:
    zone: "{{ lab_firewall_zone | default('public') }}"
    rich_rule: 'rule family="ipv4" source address="{{ item }}" service name="ftp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ lab_client_cidrs }}"

- name: Abrir puertos de FTP pasivo solo desde la red privada
  ansible.posix.firewalld:
    zone: "{{ lab_firewall_zone | default('public') }}"
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ ftp_passive_min_port }}-{{ ftp_passive_max_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ lab_client_cidrs }}"
