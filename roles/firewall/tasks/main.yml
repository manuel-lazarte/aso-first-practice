---
- name: Instalar firewalld y bindings Python
  ansible.builtin.zypper:
    name:
      - firewalld
      - python3-firewall
    state: present

# La VM de destino exige SSH autorizado antes de la primera ejecucion.
- name: Conservar acceso SSH en la zona publica antes del arranque
  ansible.posix.firewalld:
    service: ssh
    zone: public
    permanent: true
    offline: true
    state: enabled

- name: Habilitar e iniciar firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Autorizar HTTP solo desde CIDR del laboratorio
  ansible.posix.firewalld:
    zone: "{{ lab_firewall_zone | default('public') }}"
    rich_rule: 'rule family="ipv4" source address="{{ item }}" service name="http" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ lab_client_cidrs }}"
