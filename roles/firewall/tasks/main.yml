---
# El firewall del laboratorio es sensible: nunca borramos reglas de otros.
- name: Exigir zona y listas de redes explícitas
  ansible.builtin.assert:
    that:
      - lab_firewall_zone is defined
      - lab_firewall_zone | length > 0
      - lab_client_cidrs is defined
      - lab_client_cidrs | length > 0
      - postgresql_client_cidrs is defined
      - postgresql_client_cidrs | length > 0
    fail_msg: 'Configura group_vars/all/lab.yml con zona y CIDR reales.'

- name: Comprobar que todas las redes son subredes RFC1918 entre /24 y /32
  ansible.builtin.command:
    argv:
      - python3
      - '{{ playbook_dir }}/scripts/validate-lab-cidrs.py'
      - '{{ item }}'
  delegate_to: localhost
  become: false
  loop: '{{ (lab_client_cidrs + postgresql_client_cidrs) | unique | list }}'
  changed_when: false

- name: Instalar firewalld y bindings
  ansible.builtin.zypper:
    name:
      - firewalld
      - python3-firewall
    state: present

- name: Averiguar si firewalld está activo
  ansible.builtin.command: systemctl is-active firewalld
  register: aso_firewall_state
  changed_when: false
  failed_when: aso_firewall_state.rc not in [0, 3]

- name: Preparar SSH antes de activar firewalld
  ansible.posix.firewalld:
    zone: '{{ lab_firewall_zone }}'
    service: ssh
    permanent: true
    offline: true
    state: enabled
  when: aso_firewall_state.rc == 3

- name: Habilitar e iniciar firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Asegurar que se detectó una interfaz IPv4 por defecto
  ansible.builtin.assert:
    that:
      - ansible_facts.default_ipv4.interface is defined
    fail_msg: 'No se detectó interfaz IPv4. Revisa el bridge antes de editar el firewall.'

- name: Consultar zona de la interfaz de salida de la VM
  ansible.builtin.command:
    argv: [firewall-cmd, --get-zone-of-interface, '{{ ansible_facts.default_ipv4.interface }}']
  register: aso_actual_zone
  changed_when: false

- name: Rechazar una zona distinta de la declarada
  ansible.builtin.assert:
    that:
      - (aso_actual_zone.stdout | trim) == lab_firewall_zone
    fail_msg: 'Zona real distinta de lab_firewall_zone. No se modificó la zona.'

# Nunca eliminar reglas generales que podrían pertenecer a otros servicios.
# Si existen, fallar indicando al administrador qué debe revisar.
- name: Leer servicios generales de la zona permanente
  ansible.builtin.command:
    argv: [firewall-cmd, '--zone={{ lab_firewall_zone }}', --permanent, --list-services]
  register: aso_general_services
  changed_when: false

- name: Leer puertos generales de la zona permanente
  ansible.builtin.command:
    argv: [firewall-cmd, '--zone={{ lab_firewall_zone }}', --permanent, --list-ports]
  register: aso_general_ports
  changed_when: false

- name: Evitar servicios publicados globalmente antes de crear reglas propias
  ansible.builtin.assert:
    that:
      - (aso_general_services.stdout.split() | intersect(['http','ftp','samba','postgresql'])) | length == 0
      - (aso_general_ports.stdout.split() | intersect(['21/tcp','80/tcp','139/tcp','445/tcp','5432/tcp','30000-30010/tcp'])) | length == 0
    fail_msg: >-
      La zona {{ lab_firewall_zone }} tiene servicios/puertos generales de ASO.
      Revísalos con firewall-cmd --zone={{ lab_firewall_zone }} --list-all
      y --permanent --list-all; no se eliminan automáticamente reglas ajenas.

- name: Conservar el servicio SSH en la zona esperada
  ansible.posix.firewalld:
    zone: '{{ lab_firewall_zone }}'
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Autorizar HTTP solamente desde los CIDR declarados
  ansible.posix.firewalld:
    zone: '{{ lab_firewall_zone }}'
    rich_rule: 'rule family="ipv4" source address="{{ item }}" service name="http" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: '{{ lab_client_cidrs }}'
