---
- name: Instalar PHP, CLI y mod_php8 para Apache
  ansible.builtin.zypper:
    name: [php8, php8-cli, apache2-mod_php8, php8-mysql]
    state: present
  notify: Reiniciar Apache

- name: Consultar módulos habilitados en Apache
  ansible.builtin.command:
    argv: [a2enmod, -l]
  register: apache_modules
  changed_when: false

- name: Habilitar módulo PHP8 solamente si falta
  ansible.builtin.command:
    argv: [a2enmod, php8]
  when: "'php8' not in apache_modules.stdout.split()"
  notify: Reiniciar Apache

- name: Publicar página idempotente de prueba PHP sin secretos
  ansible.builtin.copy:
    dest: /srv/www/htdocs/prueba.php
    owner: root
    group: root
    mode: '0644'
    content: |
      <?php
      header('Content-Type: text/plain; charset=UTF-8');
      echo "PHP_OK\n";
      echo (extension_loaded('pgsql') && extension_loaded('pdo_pgsql'))
          ? "PDO_PGSQL_OK\n" : "PDO_PGSQL_MISSING\n";
