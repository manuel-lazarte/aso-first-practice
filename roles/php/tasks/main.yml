---
- name: Instalar PHP y mod_php8 para Apache
  ansible.builtin.zypper:
    name:
      - php8
      - apache2-mod_php8
      - php8-mysql
    state: present
  notify: Reiniciar Apache

- name: Consultar modulos habilitados en Apache
  ansible.builtin.command:
    cmd: a2enmod -l
  register: apache_modules
  changed_when: false

- name: Habilitar modulo PHP8 solo si falta
  ansible.builtin.command:
    cmd: a2enmod php8
  when: "'php8' not in apache_modules.stdout.split()"
  notify: Reiniciar Apache

- name: Publicar prueba PHP sin secretos
  ansible.builtin.copy:
    dest: /srv/www/htdocs/prueba.php
    content: |
      <?php
      header('Content-Type: text/plain; charset=UTF-8');
      echo "PHP_OK " . PHP_VERSION . "\n";
    owner: root
    group: root
    mode: '0644'
