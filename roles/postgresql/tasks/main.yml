---
- name: Exigir clientes autorizados y certificado TLS disponible
  ansible.builtin.assert:
    that:
      - postgresql_client_cidrs | length > 0
      - postgresql_server_name is defined
      - postgresql_server_name | length > 0
      - vault_postgresql_admin_password is defined
      - vault_postgresql_app_password is defined
    fail_msg: 'Faltan CIDR, nombre TLS o secretos de PostgreSQL (Vault).'
  no_log: true

- name: Verificar que existen certificados y clave en la controladora
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  loop:
    - "{{ postgresql_tls_cert_src }}"
    - "{{ postgresql_tls_key_src }}"
    - "{{ postgresql_tls_ca_src }}"
  register: postgresql_cert_files

- name: Exigir material TLS ya creado localmente
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: 'Crea certificados privados con scripts/generate-postgres-lab-certs.sh'
  loop: "{{ postgresql_cert_files.results }}"

- name: Instalar servidor, cliente, adaptador Python y modulo PHP PostgreSQL
  ansible.builtin.zypper:
    name:
      - postgresql
      - postgresql-server
      - python313-psycopg2
      - php8-pgsql
      - openssl
    state: present

- name: Habilitar e iniciar PostgreSQL (la unidad empaquetada inicializa el cluster)
  ansible.builtin.systemd:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Consultar ubicacion real del cluster de PostgreSQL
  ansible.builtin.command:
    argv: [psql, -tA, -d, postgres, -c, 'SHOW data_directory;']
  become_user: postgres
  register: postgresql_data_dir_cmd
  changed_when: false

- name: Definir directorio real detectado
  ansible.builtin.set_fact:
    postgresql_data_dir: "{{ postgresql_data_dir_cmd.stdout | trim }}"

- name: Rechazar path vacio o cluster no inicializado
  ansible.builtin.assert:
    that:
      - postgresql_data_dir | length > 4
      - postgresql_data_dir.startswith('/var/lib/pgsql/')

- name: Preparar carpeta de certificados con propiedad PostgreSQL
  ansible.builtin.file:
    path: "{{ postgresql_tls_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Copiar certificado del servidor firmado por CA del laboratorio
  ansible.builtin.copy:
    src: "{{ postgresql_tls_cert_src }}"
    dest: "{{ postgresql_tls_dir }}/server.crt"
    owner: postgres
    group: postgres
    mode: '0644'
  notify: Reiniciar PostgreSQL

- name: Copiar clave privada del servidor sin publicarla ni mostrarla
  ansible.builtin.copy:
    src: "{{ postgresql_tls_key_src }}"
    dest: "{{ postgresql_tls_dir }}/server.key"
    owner: postgres
    group: postgres
    mode: '0600'
  no_log: true
  notify: Reiniciar PostgreSQL

- name: Publicar certificado CA para referencia local
  ansible.builtin.copy:
    src: "{{ postgresql_tls_ca_src }}"
    dest: "{{ postgresql_tls_dir }}/ca.crt"
    owner: postgres
    group: postgres
    mode: '0644'

- name: Definir parametros de configuracion PostgreSQL sin destruir postgresql.conf
  community.postgresql.postgresql_set:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  become_user: postgres
  loop:
    - { name: password_encryption, value: scram-sha-256 }
    - { name: listen_addresses, value: "{{ postgresql_listen_addresses }}" }
    - { name: ssl, value: 'on' }
    - { name: ssl_min_protocol_version, value: TLSv1.2 }
    - { name: ssl_cert_file, value: "{{ postgresql_tls_dir }}/server.crt" }
    - { name: ssl_key_file, value: "{{ postgresql_tls_dir }}/server.key" }
  notify: Reiniciar PostgreSQL

- name: Crear contrasena del administrador PostgreSQL sin exponerla
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ vault_postgresql_admin_password }}"
    encrypted: true
    state: present
  become_user: postgres
  no_log: true

- name: Crear usuario PostgreSQL para la aplicacion
  community.postgresql.postgresql_user:
    name: "{{ postgresql_app_user }}"
    password: "{{ vault_postgresql_app_password }}"
    encrypted: true
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  no_log: true

- name: Crear base PostgreSQL con propietario especifico
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_app_user }}"
    encoding: UTF-8
    state: present
  become_user: postgres

- name: Insertar reglas HBA restrictivas antes de las reglas genericas
  ansible.builtin.blockinfile:
    path: "{{ postgresql_data_dir }}/pg_hba.conf"
    insertbefore: BOF
    marker: '# {mark} ANSIBLE ASO TLS'
    block: |
      {% for cidr in postgresql_client_cidrs %}
      hostssl {{ postgresql_db_name }} {{ postgresql_app_user }} {{ cidr }} scram-sha-256
      {% endfor %}
      hostnossl {{ postgresql_db_name }} {{ postgresql_app_user }} 0.0.0.0/0 reject
      hostnossl {{ postgresql_db_name }} {{ postgresql_app_user }} ::0/0 reject
      host {{ postgresql_db_name }} {{ postgresql_app_user }} 0.0.0.0/0 reject
      host {{ postgresql_db_name }} {{ postgresql_app_user }} ::0/0 reject
    owner: postgres
    group: postgres
    mode: '0600'
  notify: Reiniciar PostgreSQL

- name: Reiniciar servicio si han cambiado configuraciones TLS o acceso
  ansible.builtin.meta: flush_handlers

- name: Verificar SSL encendido en el servidor PostgreSQL
  ansible.builtin.command:
    argv: [psql, -tA, -d, postgres, -c, 'SHOW ssl;']
  become_user: postgres
  register: postgresql_ssl_test
  changed_when: false
  failed_when: postgresql_ssl_test.rc != 0 or (postgresql_ssl_test.stdout | trim) != 'on'

- name: Verificar que PHP tiene cargada la extension PostgreSQL
  ansible.builtin.command:
    argv: [php, -r, 'if (!extension_loaded("pgsql") || !extension_loaded("pdo_pgsql")) { exit(1); } echo "pgsql OK\n";']
  changed_when: false

- name: Limitar acceso PostgreSQL a subredes autorizadas
  ansible.posix.firewalld:
    zone: "{{ lab_firewall_zone | default('public') }}"
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="{{ postgresql_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ postgresql_client_cidrs }}"
