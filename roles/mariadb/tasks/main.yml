---
# Sustituye SQL manual por modulos declarativos e idempotentes.
- name: Instalar MariaDB y dependencias
  ansible.builtin.zypper:
    name:
      - mariadb
      - mariadb-client
      - python313-PyMySQL
    state: present

- name: Habilitar e iniciar MariaDB
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started

- name: Verificar que MariaDB responde
  ansible.builtin.command:
    cmd: mariadb-admin ping
  changed_when: false

- name: Crear la base de datos simulacion_db
  community.mysql.mysql_db:
    name: simulacion_db
    state: present
    encoding: utf8mb4
    login_user: mysql
    login_unix_socket: /run/mysql/mysql.sock
    config_file: ''
  become: true
  become_user: mysql

- name: Crear usuario y otorgar permisos en simulacion_db
  community.mysql.mysql_user:
    name: simulacion_user
    host: localhost
    password: "{{ vault_db_password }}"
    priv: "simulacion_db.*:ALL"
    state: present
    login_user: mysql
    login_unix_socket: /run/mysql/mysql.sock
    config_file: ''
  become: true
  become_user: mysql
  no_log: true

- name: Verificar permisos del usuario MariaDB
  ansible.builtin.command:
    argv:
      - mariadb
      - --no-defaults
      - --protocol=socket
      - -u
      - mysql
      - -e
      - "SHOW GRANTS FOR 'simulacion_user'@'localhost';"
  become: true
  become_user: mysql
  changed_when: false
