---
- name: Instalar MariaDB y PyMySQL
  ansible.builtin.zypper:
    name:
      - mariadb
      - mariadb-client
      - python313-PyMySQL
    state: present

- name: Habilitar e iniciar MariaDB
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started

- name: Crear la base simulacion_db
  community.mysql.mysql_db:
    name: simulacion_db
    state: present
    encoding: utf8mb4
    login_user: mysql
    login_unix_socket: /run/mysql/mysql.sock
    config_file: ''
  become_user: mysql

- name: Crear usuario restringido a simulacion_db
  community.mysql.mysql_user:
    name: simulacion_user
    host: localhost
    password: "{{ vault_db_password }}"
    priv: 'simulacion_db.*:ALL'
    state: present
    login_user: mysql
    login_unix_socket: /run/mysql/mysql.sock
    config_file: ''
  become_user: mysql
  no_log: true

- name: Verificar autentificacion real del usuario creado
  ansible.builtin.command:
    argv:
      - mariadb
      - --no-defaults
      - --host=localhost
      - --protocol=TCP
      - --user=simulacion_user
      - --database=simulacion_db
      - --execute=SELECT CURRENT_USER(),DATABASE();
  environment:
    MYSQL_PWD: "{{ vault_db_password }}"
  changed_when: false
  no_log: true
